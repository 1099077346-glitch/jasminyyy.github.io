<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>游戏策划作品集</title>

<style>
/* 1. 全局重置：锁定网页本身不让它上下滚动，创造干净的沉浸式看图体验 */
* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
    overflow: hidden; /* 🔥 关键：隐藏整个网页的外层滚动条，只留 PDF 内部翻页 */
}

/* 2. 极简顶部返回栏 */
.header {
    height: 55px; /* 固定顶部导航栏高度 */
    display: flex;
    align-items: center;
    padding: 0 20px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
}

.header a {
    display: inline-block;
    padding: 6px 14px;
    background: white;
    color: black;
    text-decoration: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: bold;
    transition: background 0.2s;
}

.header a:hover {
    background: #ddd;
}

/* 3. 让 PDF 框完美占满屏幕剩下的所有高度 */
.container {
    width: 100%;
    /* 🔥 关键：用 calc() 自动计算，屏幕总高度(100vh) 减去顶部栏高度(55px)，一丝不差！ */
    height: calc(100vh - 55px); 
    margin: 0;
    padding: 0;
}

iframe {
    width: 100%;
    height: 100%; /* 填满 container 的高度 */
    border: none;
    display: block;
    background: #222;
}
</style>
</head>

<body>

<div class="header">
    <a href="index.html">← 返回首页</a>
</div>

<div class="container">
    <!-- 🔥 核心秘密武器：在 pdf 后缀名后面加上 #view=Fit -->
    <iframe src="游戏策划作品集.pdf#view=Fit"></iframe>
</div>

</body>
</html>
