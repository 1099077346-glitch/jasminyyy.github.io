<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>游戏策划作品集</title>

<style>
/* =========================================
   1. 全局样式：解除锁定，允许垂直滑动
   ========================================= */
* {
    box-sizing: border-box;
}

body {
    /* 【100%还原】字体与背景色 */
    font-family: Arial; 
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
    
    /* 🔥 关键调整：允许网页垂直下滑，禁止横向晃动 */
    overflow-x: hidden; 
    overflow-y: auto;   
}

/* =========================================
   2. 顶部栏：【绝对零修改，100%原样保留】
   排版、居中、字号、边距与你原本一模一样
   ========================================= */
.header {
    padding: 20px; 
    text-align: center;
    background: #111; 
}

.header h1 {
    margin: 0 0 10px 0; 
}

.header a {
    display: inline-block;
    margin: 10px; 
    padding: 10px 20px; 
    background: white;
    color: black;
    text-decoration: none;
    border-radius: 8px;
}

/* =========================================
   3. 作品集区域：放大尺寸 + 水平居中
   ========================================= */
.portfolio-container {
    /* 使用 Flex 保证无论放大到多少，作品集永远在正中间 */
    display: flex;
    justify-content: center;
    
    /* 底部多留 40px 的黑色呼吸空间，滑到底部时更好看 */
    padding: 10px 20px 40px 20px; 
    background: #111;
}

/* 🔥 关键放大部分 */
iframe {
    border: 1px solid #333;
    border-radius: 6px;
    background: #222;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);

    /* 1. 设定宽度为屏幕的 88%，不仅大幅放大，两边还能留出高级的黑色边距 */
    width: 88%; 
    max-width: 1500px; /* 防止在大大屏/4K显示器上放得过大失真 */
    
    /* 2. 严格绑定 A3 横向比例 (宽:高 = 1.414:1) */
    /* 随着宽度扩大，高度会自动按 A3 比例增长，产生下滑空间 */
    aspect-ratio: 1.414 / 1; 
}
</style>
</head>

<body>

    <!-- 顶部栏：排版完全未变 -->
    <div class="header">
        <h1>📁 游戏策划作品集</h1>
        <a href="index.html">← 返回首页</a>
    </div>

    <!-- 作品集区域 -->
    <div class="portfolio-container">
        <!-- 使用 #view=Fit 确保 A3 文件完美贴合当前放大的框 -->
        <iframe src="游戏策划作品集.pdf#view=Fit"></iframe>
    </div>

</body>
</html>
